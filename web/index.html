<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sim_cli web 调试终端</title>
<style>
  :root {
    --bg: #f7f7f8; --fg: #1a1a1a; --dim: #6b7280; --line: #e2e2e6;
    --panel: #ffffff; --accent: #2563eb; --accent-fg: #fff;
    --err: #dc2626; --warn: #b45309; --notice: #0e7490; --info: #374151; --debug: #9ca3af;
    --ok: #16a34a; --badbg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117; --fg: #e5e7eb; --dim: #9ca3af; --line: #262a33;
      --panel: #161922; --accent: #3b82f6; --accent-fg: #fff;
      --err: #f87171; --warn: #fbbf24; --notice: #22d3ee; --info: #d1d5db; --debug: #6b7280;
      --ok: #4ade80; --badbg: #3f1d1d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .title { font-weight: 600; letter-spacing: .3px; }
  .status { margin-left: auto; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--debug); }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--err); }
  #tabs { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .tab {
    padding: 3px 12px; border: 1px solid var(--line); border-radius: 6px;
    cursor: pointer; color: var(--dim); background: transparent; user-select: none;
  }
  .tab.active { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
  .tab.unavail { opacity: .4; cursor: not-allowed; }
  .tab .live { color: var(--ok); }
  #log {
    flex: 1; overflow-y: auto; padding: 8px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .row { display: flex; gap: 8px; }
  .ts { color: var(--dim); flex: 0 0 auto; }
  .lv-error { color: var(--err); } .lv-warn { color: var(--warn); }
  .lv-notice { color: var(--notice); } .lv-info { color: var(--info); } .lv-debug { color: var(--debug); }
  .assistant { color: var(--fg); } .tool { color: var(--notice); }
  footer { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #cmd {
    flex: 1; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  #cmd:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 7px 14px; border: 1px solid var(--accent); border-radius: 6px;
    background: var(--accent); color: var(--accent-fg); font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .hint { padding: 2px 12px 8px; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
  <header>
    <span class="title">sim_cli</span>
    <span class="hintbar" style="color:var(--dim);font-size:12px">web 调试终端</span>
    <span class="status"><span id="dot" class="dot"></span><span id="stat">连接中…</span></span>
  </header>
  <div id="tabs"></div>
  <div id="log" aria-live="polite"></div>
  <div class="hint">在下方输入命令回车发送(如 <code>help</code>);点上方 tab 切换。命令与 tab 由后端下发。</div>
  <footer>
    <input id="cmd" placeholder="命令(如 help)… 回车发送" autocomplete="off" spellcheck="false" />
    <button id="send">发送</button>
  </footer>

<script>
"use strict";
// ── 状态 ──────────────────────────────────────────────────────────────
let sid = null;
let shared = null;          // 最近一次 shared 帧
let activeTab = null;

const $ = (id) => document.getElementById(id);
const logEl = $("log"), tabsEl = $("tabs"), cmdEl = $("cmd");

function setStatus(text, cls) {
  $("stat").textContent = text;
  $("dot").className = "dot" + (cls ? " " + cls : "");
}

// ── SSE:接收服务端帧 ─────────────────────────────────────────────────
function connect() {
  const es = new EventSource("events");
  es.addEventListener("session", (e) => { sid = e.data; requestWindow(); });
  es.onopen = () => setStatus("已连接", "on");
  es.onerror = () => setStatus("断开,重连中…", "off");
  es.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    handle(msg);
  };
}

function handle(msg) {
  switch (msg.type) {
    case "hello": setStatus("已连接 · 协议 v" + msg.protocol, "on"); break;
    case "shared": shared = msg; renderTabs(); break;
    case "window": renderLog(msg); break;
    case "error": flashError(msg.code + ": " + msg.detail); break;
  }
}

// ── 渲染:tab 栏(全由后端 shared 决定)──────────────────────────────
function renderTabs() {
  if (!shared) return;
  activeTab = (shared.tools[shared.active_index] || {}).name || null;
  tabsEl.innerHTML = "";
  shared.tools.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "tab" + (i === shared.active_index ? " active" : "") + (t.available ? "" : " unavail");
    el.textContent = t.name;
    if (t.active) { const d = document.createElement("span"); d.className = "live"; d.textContent = " ●"; el.appendChild(d); }
    if (t.available && i !== shared.active_index) {
      el.onclick = () => sendMsg({ type: "tab_switch", name: t.name });
    }
    tabsEl.appendChild(el);
  });
}

// ── 渲染:日志窗口(后端 window 帧,全量模式:整段替换)──────────────
function renderLog(win) {
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  const frag = document.createDocumentFragment();
  for (const m of win.messages) {
    const b = m.body;
    const ts = fmtTime(m.time_ms);
    if (b.kind === "system") {
      for (const line of splitLines(b.text)) frag.appendChild(rowEl(ts, line, "lv-" + b.level));
    } else if (b.kind === "assistant") {
      for (const line of splitLines(b.text)) frag.appendChild(rowEl(ts, line, "assistant"));
    } else if (b.kind === "tool") {
      const head = `<tool ${b.name}> [${b.status}] ${b.args_preview}`.trim();
      frag.appendChild(rowEl(ts, head, "tool"));
      if (b.output) for (const line of splitLines(b.output)) frag.appendChild(rowEl(ts, "  " + line, "tool"));
    }
  }
  logEl.innerHTML = "";
  logEl.appendChild(frag);
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

function rowEl(ts, text, cls) {
  const row = document.createElement("div"); row.className = "row";
  const t = document.createElement("span"); t.className = "ts"; t.textContent = ts;
  const s = document.createElement("span"); s.className = cls; s.textContent = text;
  row.appendChild(t); row.appendChild(s);
  return row;
}

function splitLines(s) { return (s === "" ? [""] : String(s).split("\n")); }

function fmtTime(ms) {
  const d = new Date(ms);
  const p = (n, w = 2) => String(n).padStart(w, "0");
  return `[${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}]`;
}

function flashError(text) {
  const row = rowEl(fmtTime(Date.now()), text, "lv-error");
  row.style.background = "var(--badbg)";
  logEl.appendChild(row); logEl.scrollTop = logEl.scrollHeight;
}

// ── 视口:声明本连接想看多少行(有界尾窗,跟随底部)───────────────────
// 关键性能点:不要全量(count:0)。只取"一屏 + 少量翻页余量"的尾部,后端就只
// 发这么多、浏览器就只渲染这么多 —— 传输与渲染都变成 O(一屏),与缓冲大小无关。
const OVERSCAN = 200;          // 页内可本地上滚的余量(行)
const MAX_WINDOW = 1000;       // 上限,防止极端视口
function viewportLines() {
  const lineH = 20;            // ≈ 1.5 * 13px,与 CSS 行高一致
  const rows = Math.max(10, Math.ceil(logEl.clientHeight / lineH));
  return Math.min(MAX_WINDOW, rows + OVERSCAN);
}
function requestWindow() {
  if (!sid) return;
  sendMsg({ type: "view", count: viewportLines(), follow: true });
}
// 窗口尺寸变化(resize / 字号 / 缩放)→ 重新声明视口(防抖)。
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(requestWindow, 200);
});

// ── 发送:命令 → POST /command ────────────────────────────────────────
function sendMsg(obj) {
  const url = "command" + (sid ? "?sid=" + encodeURIComponent(sid) : "");
  fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) })
    .catch(() => flashError("发送失败(连接可能已断开)"));
}

function submit() {
  const text = cmdEl.value.trim();
  if (!text) return;
  sendMsg({ type: "input", text });
  cmdEl.value = "";
}

$("send").onclick = submit;
cmdEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } });

connect();
cmdEl.focus();
</script>
</body>
</html>
